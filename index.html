<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">PD</div><div><b>Panorama Docente</b><small>2026–2027</small></div></div><nav id="nav"><button class="nav active" data-view="dashboard">🏠 Dashboard</button><button class="nav" data-view="alumnos">👨‍🎓 Alumnos</button><button class="nav" data-view="asistencia">📋 Asistencia</button><button class="nav" data-view="trabajos">📝 Trabajos</button><button class="nav" data-view="calificaciones">📊 Calificaciones</button><button class="nav" data-view="bitacora">📚 Temas / Bitácora</button><button class="nav" data-view="incidencias">⚠️ Incidencias</button><button class="nav" data-view="reportes">📈 Reportes</button><button class="nav" data-view="impresiones">🖨️ Impresiones / Adeudos</button><button class="nav" data-view="config">⚙️ Configuración</button></nav><div class="sidebar-bottom"><button class="btn ghost" id="demoBtn">Cargar datos demo</button><button class="btn ghost" id="forceUpdateBtn">🔄 Forzar actualización</button><button class="btn danger" id="resetBtn">Borrar datos locales</button></div></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Resumen de tu gestión docente</p></div><div class="top-actions"><span class="cycle">Ciclo 2026–2027</span><button class="btn primary" id="quickAdd">＋ Registro rápido</button></div></header><section id="content"></section></main></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<script src="app-config.js?v=2026.09.01.37"></script>
<script src="app.js?v=2026.09.01.37"></script>
<script src="policy.js?v=2026.09.01.37"></script>
<script src="modules.js?v=2026.09.01.37"></script>
<script>
if('serviceWorker' in navigator){
  let pdRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(pdRefreshing)return;
    pdRefreshing=true;
    window.location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js?v=2026.09.01.37').then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
      window.addEventListener('focus',()=>reg.update().catch(()=>{}));
      setInterval(()=>reg.update().catch(()=>{}),5*60*1000);
    }).catch(e=>console.warn('Offline cache:',e));
  });
}
document.getElementById('forceUpdateBtn').onclick=async()=>{
  if(!confirm('Esto borra la versión guardada en este dispositivo y trae la más reciente desde internet. Tus datos (alumnos, asistencias, etc.) NO se borran. ¿Continuar?'))return;
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs)await r.unregister();
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys)await caches.delete(k);
    }
  }catch(e){console.warn('No se pudo limpiar caché:',e)}
  location.reload();
};
</script>
</body></html>
